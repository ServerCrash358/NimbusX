apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-agent
  labels:
    app: node-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
      - name: node-agent
        image: nimbusx-node-agent:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9091
        env:
        - name: API_GATEWAY_URL
          value: "http://api:8080"
        - name: NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
---
apiVersion: v1
kind: Service
metadata:
  name: node-agent
spec:
  selector:
    app: node-agent
  ports:
    - protocol: TCP
      port: 9091
      targetPort: 9091
