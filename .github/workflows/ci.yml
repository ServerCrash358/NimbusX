name: NimbusX CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Build & Test Go Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v ./...

      - name: Build Scheduler
        run: CGO_ENABLED=0 go build -o bin/scheduler ./scheduler/

      - name: Build API Gateway
        run: CGO_ENABLED=0 go build -o bin/api ./api/

      - name: Build Oracle
        run: CGO_ENABLED=0 go build -o bin/oracle ./oracle/

      - name: Build Node Agent
        run: CGO_ENABLED=0 go build -o bin/node-agent ./node-agent/

  contracts:
    name: Test Smart Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile Contracts
        run: npx hardhat compile

      - name: Run Tests
        run: npx hardhat test
